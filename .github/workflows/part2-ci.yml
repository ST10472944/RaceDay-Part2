name: RaceDay Full Stack Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.API.sln

      - name: Build Solution (API & MVC)
        run: dotnet build RaceDay.API.sln --no-restore --configuration Release
