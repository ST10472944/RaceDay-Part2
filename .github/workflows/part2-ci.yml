name: RaceDay Full Stack Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

      - name: Build MVC App
        run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --no-restore --configuration Release
